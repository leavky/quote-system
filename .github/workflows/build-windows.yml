name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 项目结算价格匹配/desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 项目结算价格匹配/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 项目结算价格匹配/desktop/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run lint

      - name: Build Windows application
        run: npm run desktop:build -- --bundles nsis

      - name: Collect portable executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/portable | Out-Null
          Copy-Item src-tauri/target/release/app.exe artifacts/portable/报价系统.exe

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: 报价系统-Windows-${{ github.ref_name }}
          path: |
            项目结算价格匹配/desktop/artifacts/portable/
            项目结算价格匹配/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
