<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>项目结算价格匹配</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17212b;
      --muted: #66727f;
      --line: #d9e0e6;
      --soft-line: #edf1f4;
      --surface: #ffffff;
      --canvas: #f4f6f8;
      --blue: #1769aa;
      --blue-soft: #eaf3fa;
      --green: #16825d;
      --green-soft: #e4f4ed;
      --amber: #9a6700;
      --amber-soft: #fff3cd;
      --red: #b42318;
      --red-soft: #fde8e7;
      --violet: #6b4fa1;
      --violet-soft: #f0ebfa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--canvas);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button, input, select { font: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid #68a9d6;
      outline-offset: 1px;
    }
    .app-header {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 20px;
      color: #fff;
      background: #173b57;
      border-bottom: 3px solid #2b87bc;
    }
    .brand { min-width: 0; }
    .brand h1 { margin: 0; font-size: 20px; line-height: 1.2; letter-spacing: 0; }
    .brand-meta { margin-top: 3px; color: #c8d9e6; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .workspace { padding: 14px; }
    .band {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .section-head {
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--soft-line);
    }
    .section-title { margin: 0; font-size: 14px; font-weight: 700; }
    .file-row {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) minmax(260px, 1fr) auto;
      gap: 10px;
      align-items: end;
      padding: 12px;
    }
    .field { min-width: 0; }
    .field label { display: block; margin-bottom: 5px; color: #43515e; font-size: 12px; font-weight: 600; }
    .file-picker {
      min-height: 38px;
      display: flex;
      align-items: stretch;
      border: 1px solid #c8d1da;
      border-radius: 5px;
      overflow: hidden;
      background: #fff;
    }
    .file-picker input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .file-button {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      padding: 0 12px;
      border-right: 1px solid #c8d1da;
      background: #f1f4f6;
      color: #263746;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .file-name {
      min-width: 0;
      display: flex;
      align-items: center;
      padding: 0 10px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn {
      min-height: 38px;
      border: 1px solid transparent;
      border-radius: 5px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-secondary { background: #fff; color: #263746; border-color: #bfc9d2; }
    .btn-success { background: var(--green); color: #fff; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .priority-body { padding: 10px 12px 12px; }
    .priority-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .priority-item {
      height: 40px;
      display: grid;
      grid-template-columns: 25px 22px minmax(92px, auto) 30px 30px;
      align-items: center;
      gap: 4px;
      padding: 0 5px 0 8px;
      border: 1px solid #cbd5dd;
      border-radius: 5px;
      background: #fafcfd;
    }
    .priority-item.disabled { opacity: .58; }
    .priority-rank { color: var(--blue); font-size: 12px; font-weight: 800; }
    .priority-name { min-width: 0; font-size: 13px; white-space: nowrap; }
    .priority-count { color: var(--muted); font-size: 11px; }
    .icon-btn {
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid #cbd5dd;
      border-radius: 4px;
      background: #fff;
      color: #38556d;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
    }
    .priority-actions { display: flex; justify-content: flex-end; margin-top: 10px; }
    .filter-grid {
      display: grid;
      grid-template-columns: 170px 170px minmax(220px, 1.5fr) minmax(160px, 1fr) minmax(180px, 1fr) 150px 190px;
      gap: 8px;
      padding: 10px 12px 12px;
      align-items: end;
    }
    .control {
      width: 100%;
      height: 36px;
      border: 1px solid #c8d1da;
      border-radius: 4px;
      padding: 0 9px;
      background: #fff;
      color: var(--ink);
      font-size: 13px;
    }
    .query-row { display: grid; grid-template-columns: minmax(240px, 1fr) 180px auto; gap: 8px; padding: 0 12px 12px; }
    .query-actions { display: flex; gap: 8px; }
    .summary-strip {
      min-height: 68px;
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .metric { padding: 10px 14px; border-right: 1px solid var(--soft-line); }
    .metric:last-child { border-right: 0; }
    .metric-label { color: var(--muted); font-size: 12px; }
    .metric-value { margin-top: 3px; font-size: 23px; font-weight: 750; font-variant-numeric: tabular-nums; }
    .metric-value.money { color: var(--green); }
    .table-head-meta { color: var(--muted); font-size: 12px; }
    .table-wrap { max-height: calc(100vh - 430px); min-height: 260px; overflow: auto; }
    table { width: 100%; min-width: 1330px; border-collapse: separate; border-spacing: 0; }
    th, td {
      padding: 8px 9px;
      border-bottom: 1px solid var(--soft-line);
      background: #fff;
      text-align: left;
      vertical-align: middle;
      font-size: 12px;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 2;
      height: 38px;
      background: #eef3f6;
      color: #344656;
      font-weight: 700;
      white-space: nowrap;
      border-bottom-color: #cfd8df;
    }
    tbody tr:hover td { background: #f8fbfd; }
    .col-date { width: 104px; white-space: nowrap; }
    .col-report { width: 154px; white-space: nowrap; }
    .col-project { min-width: 280px; max-width: 420px; }
    .col-category { width: 150px; }
    .col-item { min-width: 210px; max-width: 340px; }
    .clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .number { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .badge {
      display: inline-flex;
      min-height: 22px;
      align-items: center;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .status-matched { background: var(--green-soft); color: #0d6b4b; }
    .status-unmatched { background: var(--red-soft); color: var(--red); }
    .status-missing { background: var(--amber-soft); color: var(--amber); }
    .status-duplicate { background: #ffead5; color: #9a4d00; }
    .status-no-price { background: var(--violet-soft); color: var(--violet); }
    .system-badge { background: var(--blue-soft); color: #145a8d; }
    .empty { height: 200px; color: var(--muted); text-align: center; vertical-align: middle; font-size: 14px; }
    .pagination {
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 7px 12px;
      border-top: 1px solid var(--soft-line);
      color: var(--muted);
      font-size: 12px;
    }
    .message { display: none; margin-bottom: 10px; padding: 10px 12px; border: 1px solid; border-radius: 5px; font-size: 13px; }
    .message.error { display: block; background: #fff1f0; border-color: #f3b8b4; color: #8f2018; }
    .message.success { display: block; background: #edf8f3; border-color: #a7d8c4; color: #12694d; }
    .loading-mask {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(244, 246, 248, .78);
    }
    .loading-mask.visible { display: flex; }
    .loading-box { padding: 14px 18px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font-size: 14px; box-shadow: 0 8px 30px rgba(31, 54, 72, .12); }
    @media (max-width: 1180px) {
      .filter-grid { grid-template-columns: repeat(3, minmax(180px, 1fr)); }
      .table-wrap { max-height: calc(100vh - 510px); }
    }
    @media (max-width: 760px) {
      .app-header { align-items: flex-start; padding: 12px; flex-direction: column; }
      .header-actions { width: 100%; }
      .header-actions .btn { flex: 1; }
      .workspace { padding: 8px; }
      .file-row, .filter-grid, .query-row { grid-template-columns: 1fr; }
      .summary-strip { grid-template-columns: repeat(2, 1fr); }
      .metric:nth-child(2) { border-right: 0; }
      .metric:nth-child(-n+2) { border-bottom: 1px solid var(--soft-line); }
      .priority-list { display: grid; grid-template-columns: 1fr; }
      .priority-item { grid-template-columns: 25px 22px 1fr 30px 30px; }
      .query-actions { width: 100%; }
      .query-actions .btn { flex: 1; }
      .table-wrap { max-height: 52vh; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <h1>项目结算价格匹配</h1>
      <div class="brand-meta" id="sourceMeta">正在加载默认文件</div>
    </div>
    <div class="header-actions">
      <button class="btn btn-secondary" id="resetBtn" type="button">重置筛选</button>
      <button class="btn btn-success" id="exportBtn" type="button" disabled>导出当前结果</button>
    </div>
  </header>

  <main class="workspace">
    <div class="message" id="message"></div>

    <section class="band">
      <div class="section-head"><h2 class="section-title">数据文件</h2></div>
      <form class="file-row" id="loadForm">
        <div class="field">
          <label for="ledgerFile">台账明细表</label>
          <label class="file-picker">
            <input id="ledgerFile" name="ledger" type="file" accept=".xls,.xlsx">
            <span class="file-button">选择文件</span>
            <span class="file-name" id="ledgerName">使用默认台账</span>
          </label>
        </div>
        <div class="field">
          <label for="priceFile">计费价格汇总表</label>
          <label class="file-picker">
            <input id="priceFile" name="price" type="file" accept=".xls,.xlsx">
            <span class="file-button">选择文件</span>
            <span class="file-name" id="priceName">使用默认价格表</span>
          </label>
        </div>
        <button class="btn btn-primary" id="loadBtn" type="submit">加载并匹配</button>
      </form>
    </section>

    <section class="band" id="prioritySection" hidden>
      <div class="section-head">
        <h2 class="section-title">价格体系优先级</h2>
        <span class="table-head-meta" id="priorityMeta"></span>
      </div>
      <div class="priority-body">
        <div class="priority-list" id="priorityList"></div>
        <div class="priority-actions">
          <button class="btn btn-primary" id="applyPriorityBtn" type="button">应用优先级</button>
        </div>
      </div>
    </section>

    <section class="band" id="filterSection" hidden>
      <div class="section-head"><h2 class="section-title">查询与筛选</h2></div>
      <div class="filter-grid">
        <div class="field"><label for="startDate">委托日期起</label><input class="control" id="startDate" type="date"></div>
        <div class="field"><label for="endDate">委托日期止</label><input class="control" id="endDate" type="date"></div>
        <div class="field"><label for="projectFilter">工程名称</label><input class="control" id="projectFilter" list="projectOptions" placeholder="输入工程名称"><datalist id="projectOptions"></datalist></div>
        <div class="field"><label for="categoryFilter">报告类别</label><select class="control" id="categoryFilter"><option value="">全部</option></select></div>
        <div class="field"><label for="itemFilter">计费项目</label><input class="control" id="itemFilter" list="itemOptions" placeholder="输入计费项目"><datalist id="itemOptions"></datalist></div>
        <div class="field"><label for="statusFilter">匹配状态</label><select class="control" id="statusFilter"><option value="">全部</option></select></div>
        <div class="field"><label for="sortOrder">排序</label><select class="control" id="sortOrder"><option value="source">台账原顺序</option><option value="date_desc">日期从新到旧</option><option value="date_asc">日期从旧到新</option><option value="amount_desc">结算金额从高到低</option></select></div>
      </div>
      <div class="query-row">
        <input class="control" id="keywordFilter" type="search" placeholder="报告编号、受理编号、委托单位、质监站等关键词">
        <select class="control" id="pageSize"><option value="50">每页 50 条</option><option value="100" selected>每页 100 条</option><option value="200">每页 200 条</option></select>
        <div class="query-actions">
          <button class="btn btn-primary" id="queryBtn" type="button">查询</button>
          <button class="btn btn-secondary" id="clearBtn" type="button">清空</button>
        </div>
      </div>
    </section>

    <section class="summary-strip" id="summarySection" hidden>
      <div class="metric"><div class="metric-label">当前记录</div><div class="metric-value" id="metricTotal">0</div></div>
      <div class="metric"><div class="metric-label">已匹配</div><div class="metric-value" id="metricMatched">0</div></div>
      <div class="metric"><div class="metric-label">待处理</div><div class="metric-value" id="metricUnresolved">0</div></div>
      <div class="metric"><div class="metric-label">结算金额</div><div class="metric-value money" id="metricAmount">0.00</div></div>
    </section>

    <section class="band" id="resultSection" hidden>
      <div class="section-head">
        <h2 class="section-title">结算明细</h2>
        <span class="table-head-meta" id="resultMeta"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="col-date">委托日期</th>
              <th class="col-report">报告编号</th>
              <th class="col-project">工程名称</th>
              <th class="col-category">报告类别</th>
              <th class="col-item">计费项目</th>
              <th class="number">数量</th>
              <th class="number">台账单价</th>
              <th>价格体系</th>
              <th class="number">结算单价</th>
              <th class="number">结算金额</th>
              <th>项目编号</th>
              <th>状态</th>
            </tr>
          </thead>
          <tbody id="resultBody"><tr><td class="empty" colspan="12">正在加载</td></tr></tbody>
        </table>
      </div>
      <div class="pagination">
        <span id="pageMeta">第 1 页</span>
        <button class="icon-btn" id="prevPage" type="button" title="上一页" aria-label="上一页">‹</button>
        <button class="icon-btn" id="nextPage" type="button" title="下一页" aria-label="下一页">›</button>
      </div>
    </section>
  </main>

  <div class="loading-mask" id="loadingMask"><div class="loading-box" id="loadingText">正在处理</div></div>

  <script>
    const state = { sessionId: '', records: [], filtered: [], systems: [], priority: [], page: 1, pageSize: 100 };
    const byId = (id) => document.getElementById(id);
    const filterIds = ['startDate', 'endDate', 'projectFilter', 'categoryFilter', 'itemFilter', 'statusFilter', 'keywordFilter', 'sortOrder'];

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    }
    function money(value) {
      if (value === null || value === undefined || value === '') return '';
      const number = Number(value);
      return Number.isFinite(number) ? number.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : escapeHtml(value);
    }
    function plainNumber(value) {
      if (value === null || value === undefined || value === '') return '';
      const number = Number(value);
      return Number.isFinite(number) ? number.toLocaleString('zh-CN', { maximumFractionDigits: 4 }) : escapeHtml(value);
    }
    function setLoading(visible, text = '正在处理') {
      byId('loadingText').textContent = text;
      byId('loadingMask').classList.toggle('visible', visible);
    }
    function showMessage(text, kind = 'error') {
      const node = byId('message');
      node.textContent = text;
      node.className = `message ${kind}`;
    }
    function clearMessage() {
      byId('message').className = 'message';
      byId('message').textContent = '';
    }
    async function jsonRequest(url, options = {}) {
      const response = await fetch(url, options);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `请求失败 (${response.status})`);
      return data;
    }

    function acceptPayload(data) {
      state.sessionId = data.session_id;
      state.records = data.records || [];
      state.systems = data.systems || [];
      state.priority = (data.priority || []).map((entry) => ({...entry}));
      state.page = 1;
      byId('sourceMeta').textContent = `${data.ledger_name}  ·  ${data.price_name}`;
      byId('prioritySection').hidden = false;
      byId('filterSection').hidden = false;
      byId('summarySection').hidden = false;
      byId('resultSection').hidden = false;
      byId('exportBtn').disabled = false;
      populateFilters();
      renderPriority();
      applyFilters();
    }

    async function loadFiles(event) {
      if (event) event.preventDefault();
      clearMessage();
      setLoading(true, '正在读取并精确匹配');
      try {
        const formData = new FormData();
        const ledger = byId('ledgerFile').files[0];
        const price = byId('priceFile').files[0];
        if (ledger) formData.append('ledger', ledger);
        if (price) formData.append('price', price);
        const data = await jsonRequest('/api/load', { method: 'POST', body: formData });
        acceptPayload(data);
      } catch (error) {
        showMessage(error.message);
      } finally {
        setLoading(false);
      }
    }

    function systemCount(name) {
      const system = state.systems.find((item) => item.name === name);
      return system ? system.non_empty : 0;
    }
    function renderPriority() {
      byId('priorityList').innerHTML = state.priority.map((entry, index) => `
        <div class="priority-item ${entry.enabled ? '' : 'disabled'}">
          <span class="priority-rank">${index + 1}</span>
          <input type="checkbox" ${entry.enabled ? 'checked' : ''} onchange="togglePriority(${index}, this.checked)" aria-label="启用${escapeHtml(entry.name)}">
          <span class="priority-name">${escapeHtml(entry.name)} <span class="priority-count">${systemCount(entry.name)}</span></span>
          <button class="icon-btn" type="button" title="上移" aria-label="上移${escapeHtml(entry.name)}" onclick="movePriority(${index}, -1)" ${index === 0 ? 'disabled' : ''}>↑</button>
          <button class="icon-btn" type="button" title="下移" aria-label="下移${escapeHtml(entry.name)}" onclick="movePriority(${index}, 1)" ${index === state.priority.length - 1 ? 'disabled' : ''}>↓</button>
        </div>
      `).join('');
      const enabled = state.priority.filter((entry) => entry.enabled).length;
      byId('priorityMeta').textContent = `已启用 ${enabled}/${state.priority.length}`;
    }
    window.movePriority = function(index, delta) {
      const target = index + delta;
      if (target < 0 || target >= state.priority.length) return;
      [state.priority[index], state.priority[target]] = [state.priority[target], state.priority[index]];
      renderPriority();
    };
    window.togglePriority = function(index, checked) {
      state.priority[index].enabled = checked;
      renderPriority();
    };
    async function applyPriority() {
      if (!state.priority.some((entry) => entry.enabled)) {
        showMessage('至少启用一个价格体系');
        return;
      }
      clearMessage();
      setLoading(true, '正在按新优先级重新计价');
      try {
        const data = await jsonRequest('/api/reprice', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ session_id: state.sessionId, priority: state.priority }),
        });
        acceptPayload(data);
        showMessage('价格优先级已应用', 'success');
      } catch (error) {
        showMessage(error.message);
      } finally {
        setLoading(false);
      }
    }

    function uniqueSorted(key) {
      return [...new Set(state.records.map((record) => record[key]).filter(Boolean))].sort((a, b) => String(a).localeCompare(String(b), 'zh-CN'));
    }
    function populateFilters() {
      const currentCategory = byId('categoryFilter').value;
      const currentStatus = byId('statusFilter').value;
      byId('categoryFilter').innerHTML = '<option value="">全部</option>' + uniqueSorted('report_category').map((value) => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join('');
      byId('statusFilter').innerHTML = '<option value="">全部</option>' + uniqueSorted('status').map((value) => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join('');
      byId('projectOptions').innerHTML = uniqueSorted('project_name').map((value) => `<option value="${escapeHtml(value)}"></option>`).join('');
      byId('itemOptions').innerHTML = uniqueSorted('billing_item').map((value) => `<option value="${escapeHtml(value)}"></option>`).join('');
      if ([...byId('categoryFilter').options].some((option) => option.value === currentCategory)) byId('categoryFilter').value = currentCategory;
      if ([...byId('statusFilter').options].some((option) => option.value === currentStatus)) byId('statusFilter').value = currentStatus;
    }

    function applyFilters(resetPage = true) {
      const start = byId('startDate').value;
      const end = byId('endDate').value;
      const project = byId('projectFilter').value.trim().toLocaleLowerCase('zh-CN');
      const category = byId('categoryFilter').value;
      const item = byId('itemFilter').value.trim().toLocaleLowerCase('zh-CN');
      const status = byId('statusFilter').value;
      const keyword = byId('keywordFilter').value.trim().toLocaleLowerCase('zh-CN');
      state.pageSize = Number(byId('pageSize').value) || 100;
      state.filtered = state.records.filter((record) => {
        if (start && (!record.date || record.date < start)) return false;
        if (end && (!record.date || record.date > end)) return false;
        if (project && !String(record.project_name || '').toLocaleLowerCase('zh-CN').includes(project)) return false;
        if (category && record.report_category !== category) return false;
        if (item && !String(record.billing_item || '').toLocaleLowerCase('zh-CN').includes(item)) return false;
        if (status && record.status !== status) return false;
        if (keyword) {
          const blob = [record.report_number, record.project_name, record.unit_project, record.client_name, record.report_category, record.billing_item, record.matched_code, record.status].join(' ').toLocaleLowerCase('zh-CN');
          if (!blob.includes(keyword)) return false;
        }
        return true;
      });
      const sort = byId('sortOrder').value;
      if (sort === 'date_desc') state.filtered.sort((a, b) => String(b.date).localeCompare(String(a.date)));
      if (sort === 'date_asc') state.filtered.sort((a, b) => String(a.date).localeCompare(String(b.date)));
      if (sort === 'amount_desc') state.filtered.sort((a, b) => (b.settlement_amount ?? -Infinity) - (a.settlement_amount ?? -Infinity));
      if (resetPage) state.page = 1;
      renderSummary();
      renderTable();
    }

    function renderSummary() {
      const matched = state.filtered.filter((record) => record.status === '已匹配').length;
      const amount = state.filtered.reduce((sum, record) => sum + (Number(record.settlement_amount) || 0), 0);
      byId('metricTotal').textContent = state.filtered.length.toLocaleString('zh-CN');
      byId('metricMatched').textContent = matched.toLocaleString('zh-CN');
      byId('metricUnresolved').textContent = (state.filtered.length - matched).toLocaleString('zh-CN');
      byId('metricAmount').textContent = amount.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      byId('resultMeta').textContent = `当前 ${state.filtered.length} 条 / 全部 ${state.records.length} 条`;
    }
    function statusClass(status) {
      return ({'已匹配':'status-matched','未匹配':'status-unmatched','字段缺失':'status-missing','价格表重复':'status-duplicate','无可用价格':'status-no-price'})[status] || 'status-missing';
    }
    function priceTooltip(record) {
      const entries = Object.entries(record.available_prices || {}).filter(([, value]) => value !== null && value !== undefined);
      return entries.map(([name, value]) => `${name}: ${money(value)}`).join('；');
    }
    function renderTable() {
      const pageCount = Math.max(1, Math.ceil(state.filtered.length / state.pageSize));
      state.page = Math.min(Math.max(state.page, 1), pageCount);
      const start = (state.page - 1) * state.pageSize;
      const rows = state.filtered.slice(start, start + state.pageSize);
      if (!rows.length) {
        byId('resultBody').innerHTML = '<tr><td class="empty" colspan="12">没有符合条件的记录</td></tr>';
      } else {
        byId('resultBody').innerHTML = rows.map((record) => `
          <tr>
            <td class="col-date">${escapeHtml(record.date)}</td>
            <td class="col-report clip" title="${escapeHtml(record.report_number)}">${escapeHtml(record.report_number)}</td>
            <td class="col-project clip" title="${escapeHtml(record.project_name)}">${escapeHtml(record.project_name)}</td>
            <td class="col-category clip" title="${escapeHtml(record.report_category)}">${escapeHtml(record.report_category)}</td>
            <td class="col-item clip" title="${escapeHtml(record.billing_item)}">${escapeHtml(record.billing_item)}</td>
            <td class="number">${plainNumber(record.quantity)}</td>
            <td class="number">${money(record.source_unit_price)}</td>
            <td>${record.selected_system ? `<span class="badge system-badge" title="${escapeHtml(priceTooltip(record))}">${escapeHtml(record.selected_system)}</span>` : ''}</td>
            <td class="number" title="${escapeHtml(priceTooltip(record))}">${money(record.selected_price)}</td>
            <td class="number">${money(record.settlement_amount)}</td>
            <td>${escapeHtml(record.matched_code)}</td>
            <td><span class="badge ${statusClass(record.status)}">${escapeHtml(record.status)}</span></td>
          </tr>
        `).join('');
      }
      byId('pageMeta').textContent = `第 ${state.page} / ${pageCount} 页`;
      byId('prevPage').disabled = state.page <= 1;
      byId('nextPage').disabled = state.page >= pageCount;
    }

    function clearFilters() {
      filterIds.forEach((id) => {
        const node = byId(id);
        node.value = id === 'sortOrder' ? 'source' : '';
      });
      byId('pageSize').value = '100';
      applyFilters();
    }
    async function exportFiltered() {
      if (!state.sessionId) return;
      clearMessage();
      setLoading(true, '正在生成 Excel');
      try {
        const data = await jsonRequest('/api/export', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ session_id: state.sessionId, row_ids: state.filtered.map((record) => record.id) }),
        });
        window.location.href = data.download_url;
        showMessage(`已生成 ${data.exported} 条结算明细`, 'success');
      } catch (error) {
        showMessage(error.message);
      } finally {
        setLoading(false);
      }
    }

    byId('loadForm').addEventListener('submit', loadFiles);
    byId('applyPriorityBtn').addEventListener('click', applyPriority);
    byId('queryBtn').addEventListener('click', () => applyFilters());
    byId('clearBtn').addEventListener('click', clearFilters);
    byId('resetBtn').addEventListener('click', clearFilters);
    byId('exportBtn').addEventListener('click', exportFiltered);
    byId('pageSize').addEventListener('change', () => applyFilters());
    byId('prevPage').addEventListener('click', () => { state.page -= 1; renderTable(); });
    byId('nextPage').addEventListener('click', () => { state.page += 1; renderTable(); });
    byId('keywordFilter').addEventListener('keydown', (event) => { if (event.key === 'Enter') applyFilters(); });
    byId('ledgerFile').addEventListener('change', (event) => { byId('ledgerName').textContent = event.target.files[0]?.name || '使用默认台账'; });
    byId('priceFile').addEventListener('change', (event) => { byId('priceName').textContent = event.target.files[0]?.name || '使用默认价格表'; });
    document.addEventListener('DOMContentLoaded', () => loadFiles());
  </script>
</body>
</html>
